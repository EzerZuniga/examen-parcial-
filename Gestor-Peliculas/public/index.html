<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de películas</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Gestor de películas</h1>

    <form id="movieForm">

        <input
            type="text"
            id="title"
            placeholder="Título"
            required
        >

        <input
            type="text"
            id="genre"
            placeholder="Género"
            required
        >

        <input
            type="text"
            id="director"
            placeholder="Director"
            required
        >

        <input
            type="number"
            id="year"
            placeholder="Año"
            required
        >

        <button type="submit">
            Agregar
        </button>

    </form>

    <div id="moviesContainer"></div>

    <script type="module" src="app.js"></script>

</body>
</html>
